<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✈️ Professional Aviation Course Simulator (AFH)</title>
    <style>
        /* --- RESET & GLOBAL --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a1118;
            color: #e0f0ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* --- HEADER --- */
        .header {
            background: #14222e;
            padding: 10px 16px;
            border-bottom: 2px solid #2a8c9e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 10px;
            z-index: 10;
            position: relative;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #8dd0e6;
            white-space: nowrap;
        }
        .header h1 span {
            color: #f2b84b;
        }
        .header .progress-text {
            font-size: 0.75rem;
            background: #1d2e3d;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a5a70;
            white-space: nowrap;
        }
        .hamburger {
            display: none;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: #8dd0e6;
            cursor: pointer;
            padding: 0 8px;
            line-height: 1;
            touch-action: manipulation;
        }
        .hamburger:hover {
            color: #f2b84b;
        }

        /* --- OVERLAY (mobile) --- */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
        }
        .overlay.active {
            display: block;
        }

        /* --- MAIN LAYOUT --- */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- SIDEBAR (MODULES) --- */
        .sidebar {
            width: 260px;
            background: #0f1a24;
            border-right: 1px solid #1f3545;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 12px 0;
            transition: left 0.25s ease;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #2a8c9e;
            border-radius: 10px;
        }

        .module-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: #9bbfd6;
            padding: 14px 20px;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: 0.15s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #15222e;
            touch-action: manipulation;
        }
        .module-btn:hover {
            background: #1b2c3b;
            color: #fff;
        }
        .module-btn.active {
            background: #1b2f3f;
            border-left-color: #f2b84b;
            color: #fff;
        }
        .module-btn .badge {
            background: #1f3a4a;
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 0.7rem;
            color: #8dd0e6;
            margin-left: auto;
            white-space: nowrap;
        }
        .module-btn .badge.done {
            background: #2a6b4a;
            color: #a0e6b0;
        }

        /* --- CONTENT AREA --- */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            overflow-y: auto;
            background: #0e171f;
            min-width: 0;
        }

        .lesson-area {
            flex: 1;
            min-width: 0;
        }
        .lesson-area h2 {
            color: #f2b84b;
            font-size: 1.6rem;
            margin-bottom: 4px;
            border-bottom: 1px solid #1f3545;
            padding-bottom: 8px;
            word-break: break-word;
        }
        .lesson-area .sub {
            color: #8dd0e6;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .lesson-area .content-text {
            background: #111f2b;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.7;
            border-left: 4px solid #2a8c9e;
            margin-bottom: 20px;
            word-break: break-word;
            font-size: 0.95rem;
        }
        .lesson-area .content-text strong {
            color: #f2b84b;
        }
        .lesson-area .key-points {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 20px 0;
        }
        .lesson-area .key-points span {
            background: #1a2d3d;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid #2a4a5a;
        }

        /* --- QUIZ --- */
        .quiz-container {
            background: #12212d;
            border-radius: 14px;
            padding: 18px 20px;
            margin-top: 10px;
            border: 1px solid #1f3a4a;
        }
        .quiz-container h3 {
            color: #8dd0e6;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        .quiz-question {
            margin-bottom: 18px;
        }
        .quiz-question p {
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .quiz-question label {
            display: block;
            padding: 8px 14px;
            margin: 4px 0;
            background: #0f1f2b;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.9rem;
            border: 1px solid transparent;
            touch-action: manipulation;
        }
        .quiz-question label:hover {
            background: #1c3547;
        }
        .quiz-question input[type="radio"] {
            margin-right: 12px;
            accent-color: #f2b84b;
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }
        .quiz-btn {
            background: #2a8c9e;
            border: none;
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            touch-action: manipulation;
            width: 100%;
            max-width: 260px;
        }
        .quiz-btn:hover {
            background: #3aaec4;
            transform: scale(1.02);
        }
        .quiz-btn:active {
            transform: scale(0.96);
        }
        .quiz-feedback {
            margin-top: 15px;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            font-size: 0.95rem;
        }
        .quiz-feedback.show {
            display: block;
        }
        .quiz-feedback.pass {
            background: #1a4a3a;
            border: 1px solid #4aa87a;
            color: #b0e6c0;
        }
        .quiz-feedback.fail {
            background: #4a2a2a;
            border: 1px solid #a84a4a;
            color: #f0b0b0;
        }

        /* --- FLIGHT SIMULATOR PANEL --- */
        .sim-panel {
            background: #0c1822;
            border-top: 2px solid #1f3545;
            padding: 14px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            margin-top: 18px;
            border-radius: 16px;
            flex-shrink: 0;
        }
        .sim-panel canvas {
            display: block;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 400 / 240;
            background: #091116;
            border-radius: 16px;
            border: 1px solid #1f3a4a;
            touch-action: none;
        }
        .sim-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 30px;
            flex: 1;
            min-width: 160px;
        }
        .sim-controls .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 110px;
        }
        .sim-controls label {
            font-size: 0.75rem;
            color: #8dd0e6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .sim-controls input[type="range"] {
            width: 100%;
            accent-color: #f2b84b;
            background: #1d2e3d;
            height: 6px;
            border-radius: 10px;
            touch-action: manipulation;
            cursor: pointer;
        }
        .sim-controls .value-display {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-top: 2px;
        }
        .sim-stats {
            display: flex;
            gap: 20px;
            background: #0f1a24;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid #1f3545;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sim-stats div {
            text-align: center;
            padding: 2px 4px;
        }
        .sim-stats .label {
            font-size: 0.6rem;
            color: #7a9ab0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
        }
        .sim-stats .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f2b84b;
            line-height: 1.2;
        }

        /* ============================================================ */
        /*                  RESPONSIVE TWEAKS                             */
        /* ============================================================ */

        /* --- TABLETS & SMALL LAPTOPS --- */
        @media (max-width: 820px) {
            .content {
                padding: 16px;
            }
            .sidebar {
                width: 240px;
            }
            .sim-panel canvas {
                max-width: 100%;
            }
            .sim-stats {
                gap: 12px;
                padding: 4px 12px;
            }
            .sim-stats .val {
                font-size: 1rem;
            }
        }

        /* --- PHONES (portrait & small screens) --- */
        @media (max-width: 640px) {
            .hamburger {
                display: block;
            }

            /* Sidebar becomes a slide-out drawer */
            .sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                width: 280px;
                height: 100%;
                z-index: 1001;
                background: #0f1a24;
                border-right: 1px solid #1f3545;
                transition: left 0.25s ease;
                padding-top: 60px;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.6);
            }
            .sidebar.open {
                left: 0;
            }

            .module-btn {
                padding: 16px 20px;
                font-size: 1rem;
                border-left-width: 6px;
            }
            .module-btn .badge {
                font-size: 0.7rem;
                padding: 2px 10px;
            }

            .main-container {
                flex-direction: column;
            }

            .content {
                padding: 12px 14px;
            }

            .lesson-area h2 {
                font-size: 1.3rem;
            }
            .lesson-area .content-text {
                padding: 14px 16px;
                font-size: 0.9rem;
            }
            .lesson-area .key-points span {
                font-size: 0.75rem;
                padding: 4px 12px;
            }

            .quiz-container {
                padding: 14px 14px;
            }
            .quiz-question p {
                font-size: 0.9rem;
            }
            .quiz-question label {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            .quiz-btn {
                max-width: 100%;
                padding: 14px 20px;
                font-size: 1rem;
            }

            /* Sim panel full vertical */
            .sim-panel {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
                gap: 12px;
            }
            .sim-panel canvas {
                width: 100%;
                max-width: 100%;
                height: auto;
                aspect-ratio: 400 / 240;
                margin: 0 auto;
            }
            .sim-controls {
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }
            .sim-controls .control-group {
                min-width: unset;
                width: 100%;
            }
            .sim-controls input[type="range"] {
                height: 8px;
            }
            .sim-stats {
                margin-left: 0;
                width: 100%;
                justify-content: space-around;
                gap: 8px;
                padding: 8px 10px;
            }
            .sim-stats .val {
                font-size: 1.1rem;
            }
            .sim-stats .label {
                font-size: 0.6rem;
            }

            .header h1 {
                font-size: 1rem;
            }
            .header .progress-text {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .hamburger {
                font-size: 1.6rem;
                padding: 4px;
            }
        }

        /* --- VERY SMALL PHONES (<= 400px) --- */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 0.85rem;
            }
            .header .progress-text {
                font-size: 0.6rem;
                padding: 2px 8px;
            }
            .content {
                padding: 8px 10px;
            }
            .lesson-area h2 {
                font-size: 1.1rem;
            }
            .sim-stats .val {
                font-size: 0.95rem;
            }
            .sim-stats {
                gap: 4px;
                padding: 4px 6px;
            }
            .sim-stats div {
                padding: 0 2px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <button class="hamburger" id="menuToggle" aria-label="Toggle module menu">☰</button>
        <h1>✈️ <span>AFH</span> Simulator</h1>
        <div class="progress-text">Progress: <span id="progressPercentage">0</span>%</div>
    </header>

    <!-- OVERLAY (mobile) -->
    <div class="overlay" id="menuOverlay"></div>

    <!-- MAIN -->
    <div class="main-container">

        <!-- SIDEBAR -->
        <nav class="sidebar" id="sidebar"></nav>

        <!-- CONTENT -->
        <main class="content" id="mainContent">
            <div class="lesson-area" id="lessonArea">
                <h2 id="lessonTitle">Loading...</h2>
                <div class="sub" id="lessonSub">Airplane Flying Handbook</div>
                <div class="content-text" id="lessonText"></div>
                <div class="key-points" id="keyPoints"></div>
                <div class="quiz-container" id="quizContainer">
                    <h3>📝 Knowledge Check</h3>
                    <div id="quizQuestions"></div>
                    <button class="quiz-btn" id="submitQuiz">Submit Answers</button>
                    <div class="quiz-feedback" id="quizFeedback"></div>
                </div>
            </div>

            <!-- SIMULATOR PANEL -->
            <div class="sim-panel">
                <canvas id="flightCanvas" width="400" height="240"></canvas>
                <div class="sim-controls">
                    <div class="control-group">
                        <label>🔄 Pitch</label>
                        <input type="range" id="pitchSlider" min="-1" max="1" step="0.01" value="0.0">
                        <span class="value-display" id="pitchValue">0.0</span>
                    </div>
                    <div class="control-group">
                        <label>⚡ Power</label>
                        <input type="range" id="powerSlider" min="0" max="1" step="0.01" value="0.5">
                        <span class="value-display" id="powerValue">0.50</span>
                    </div>
                    <div class="sim-stats">
                        <div><span class="label">IAS</span><div class="val" id="iasDisplay">80</div></div>
                        <div><span class="label">ALT</span><div class="val" id="altDisplay">1000</div></div>
                        <div><span class="label">V/S</span><div class="val" id="vsDisplay">0</div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        // 1. MODULE DATA (Based on FAA Airplane Flying Handbook)
        // ============================================================
        const modules = [{
            id: 0,
            title: "Principles of Flight",
            sub: "Four Forces & Aerodynamics",
            text: `<strong>Lift, Weight, Thrust, and Drag</strong> are the four fundamental forces.
            <br><br>
            <strong>Lift</strong> is generated by the wing and opposes weight. It depends on airspeed, angle of attack, and air density.
            <br><br>
            <strong>Weight</strong> acts downward through the center of gravity.
            <br><br>
            <strong>Thrust</strong> is produced by the propeller or jet engine, opposing drag.
            <br><br>
            <strong>Drag</strong> is the aerodynamic resistance, composed of parasite drag (form, friction) and induced drag (byproduct of lift).`,
            points: ["Lift opposes Weight", "Thrust opposes Drag", "Angle of Attack is critical for lift generation"],
            quiz: [
                { q: "What opposes Weight in steady flight?", options: ["Lift", "Thrust", "Drag", "Gravity"], correct: 0 },
                { q: "Which type of drag is a byproduct of producing lift?", options: ["Parasite Drag", "Induced Drag", "Form Drag", "Skin Friction"], correct: 1 }
            ]
        }, {
            id: 1,
            title: "Flight Controls",
            sub: "Primary & Secondary",
            text: `<strong>Primary Controls:</strong> Ailerons (roll), Elevator (pitch), Rudder (yaw).
            <br><br>
            <strong>Secondary Controls:</strong> Flaps (increase lift/drag at low speeds), Trim tabs (relieve control pressure), and Spoilers.
            <br><br>
            The <strong>elevator</strong> controls the aircraft's pitch attitude. Moving the yoke aft raises the nose.
            <br><br>
            The <strong>ailerons</strong> move differentially to bank the aircraft. The rudder coordinates turns to prevent adverse yaw.`,
            points: ["Ailerons = Roll", "Elevator = Pitch", "Rudder = Yaw", "Flaps increase lift & drag"],
            quiz: [
                { q: "What primary control surface controls pitch?", options: ["Ailerons", "Elevator", "Rudder", "Flaps"], correct: 1 },
                { q: "What is the purpose of trim tabs?", options: ["Increase lift", "Relieve control pressure", "Slow the aircraft", "Increase drag"], correct: 1 }
            ]
        }, {
            id: 2,
            title: "Aerodynamics of Maneuvering",
            sub: "Load Factors & Turning",
            text: `During maneuvers, <strong>load factor</strong> increases. In a level turn, load factor increases with bank angle.
            <br><br>
            At a 60° bank, the load factor is 2G, meaning the wings must produce twice the aircraft's weight.
            <br><br>
            This increases <strong>stall speed</strong>. The stall speed increases by the square root of the load factor.
            <br><br>
            <strong>Overbanking tendency</strong> occurs in steep turns; the outer wing travels faster and generates more lift, requiring opposite aileron pressure.`,
            points: ["Load factor = 1/cos(bank angle)", "Stall speed increases in turns", "Overbanking requires opposite aileron"],
            quiz: [
                { q: "What is the load factor in a 60° banked level turn?", options: ["1G", "1.5G", "2G", "3G"], correct: 2 },
                { q: "What happens to stall speed in a steep turn?", options: ["Decreases", "Increases", "Stays the same", "Becomes zero"], correct: 1 }
            ]
        }, {
            id: 3,
            title: "Preflight & Engine Start",
            sub: "Before Takeoff",
            text: `<strong>Preflight Inspection:</strong> Check fuel quantity/quality, oil, control surfaces (freedom of movement), landing gear, and static ports.
            <br><br>
            <strong>Engine Start:</strong> Master switch ON, mixture RICH (or idle cut-off depending on engine), throttle open 1/4 inch, engage starter.
            <br><br>
            After start, check oil pressure, temperature, and run-up magneto checks (drop within limits) and carburetor heat.`,
            points: ["Always sump fuel tanks for water", "Check control surfaces free", "Magneto drop must be within limits"],
            quiz: [
                { q: "Before engine start, what is the recommended throttle position?", options: ["Full Open", "Closed", "1/4 inch open", "Half Open"], correct: 2 },
                { q: "What does a magneto check verify?", options: ["Fuel flow", "Ignition system", "Oil pressure", "Airspeed"], correct: 1 }
            ]
        }, {
            id: 4,
            title: "Takeoffs & Departure Climbs",
            sub: "Normal & Crosswind",
            text: `<strong>Normal Takeoff:</strong> Apply full power, maintain centerline, rotate at Vr (typically 55-65 KIAS for light aircraft), and establish Vx (best angle) or Vy (best rate) climb.
            <br><br>
            <strong>Crosswind Takeoff:</strong> Use aileron into the wind to prevent wing lift, and rudder to maintain runway heading.
            <br><br>
            <strong>Vx</strong> (Best Angle) yields the most altitude per horizontal distance (obstacle clearance). <strong>Vy</strong> (Best Rate) yields the most altitude per time.`,
            points: ["Rotate at Vr", "Use aileron into the wind for crosswind", "Vx for obstacles, Vy for time"],
            quiz: [
                { q: "Which speed gives the best altitude gain per horizontal distance?", options: ["Vx", "Vy", "Va", "Vne"], correct: 0 },
                { q: "In a crosswind takeoff, how should the ailerons be positioned during the ground roll?", options: ["Neutral", "Into the wind", "Away from the wind", "Fully deflected"], correct: 1 }
            ]
        }, {
            id: 5,
            title: "Slow Flight & Stalls",
            sub: "Approach to Stall & Recovery",
            text: `<strong>Slow Flight</strong> is practiced just above stall speed to develop precise aircraft handling. Power is used to control altitude, pitch to control airspeed.
            <br><br>
            <strong>Stalls:</strong> Occur when the critical angle of attack is exceeded. <strong>Power-On Stalls</strong> simulate takeoff/departure stalls. <strong>Power-Off Stalls</strong> simulate approach/landing stalls.
            <br><br>
            <strong>Recovery:</strong> Reduce the angle of attack (push forward), apply full power, and level the wings.`,
            points: ["Stall is an angle-of-attack condition, not speed", "Reduce AOA to recover", "Use rudder to prevent spin"],
            quiz: [
                { q: "What is the primary cause of a stall?", options: ["Low speed", "Excessive angle of attack", "High power", "Low altitude"], correct: 1 },
                { q: "What is the first action in a stall recovery?", options: ["Apply full power", "Reduce angle of attack", "Retract flaps", "Turn into the wind"], correct: 1 }
            ]
        }, {
            id: 6,
            title: "Ground Reference Maneuvers",
            sub: "Turns Around a Point",
            text: `<strong>Turns Around a Point</strong> teach the pilot to compensate for wind drift while maintaining a constant radius around a ground landmark.
            <br><br>
            In a wind, the bank angle must be <strong>steepest downwind</strong> (to tighten the turn) and <strong>shallowest upwind</strong> (to widen the turn).
            <br><br>
            <strong>Rectangular Course</strong> simulates the traffic pattern. Maintain a parallel track to the field boundaries.`,
            points: ["Steepest bank downwind", "Shallowest bank upwind", "Crabbing into the wind on crosswind legs"],
            quiz: [
                { q: "During a turn around a point, when is the bank angle steepest?", options: ["Upwind", "Downwind", "Crosswind", "Constant"], correct: 1 },
                { q: "What ground maneuver simulates a traffic pattern?", options: ["S-turns", "Rectangular Course", "Turns around a point", "Eights on pylons"], correct: 1 }
            ]
        }, {
            id: 7,
            title: "Approaches & Landings",
            sub: "Normal & Crosswind",
            text: `<strong>Normal Approach:</strong> Establish a stabilized approach at 1.3 Vso, with full flaps. Power controls the descent rate (glidepath), pitch controls the airspeed.
            <br><br>
            <strong>Roundout (Flare):</strong> Transition the airplane from a descent to a level attitude, touching down on the main wheels at minimum controllable airspeed.
            <br><br>
            <strong>Crosswind Landing:</strong> Apply aileron into the wind and opposite rudder to keep the longitudinal axis aligned with the runway (crabbing or side-slipping).`,
            points: ["Stabilized approach is key", "Flare reduces vertical speed", "Crosswind: wing low, opposite rudder"],
            quiz: [
                { q: "What is the typical final approach speed for a light aircraft? (1.3 Vso)", options: ["1.5 Vso", "1.3 Vso", "1.0 Vso", "Vne"], correct: 1 },
                { q: "How do you correct for crosswind during the flare?", options: ["Wing low, opposite rudder", "Wing high, opposite rudder", "Wing low, same rudder", "Neutral controls"], correct: 0 }
            ]
        }, {
            id: 8,
            title: "Performance Maneuvers",
            sub: "Steep Turns & Stalls",
            text: `<strong>Steep Turns</strong> (45-60° bank) require increased back pressure (elevator) to maintain altitude due to the increased load factor.
            <br><br>
            To maintain altitude in a steep turn, you must add <strong>back pressure</strong> and often <strong>power</strong> to compensate for the increased induced drag.
            <br><br>
            <strong>Chandelles</strong> and <strong>Lazy Eights</strong> are advanced maneuvers that develop coordination and smooth control application.`,
            points: ["Steep turns require back pressure", "Load factor increases significantly", "Power is needed to maintain speed"],
            quiz: [
                { q: "To maintain altitude in a steep turn, what control input is required?", options: ["Forward pressure", "Back pressure", "Reduce power", "Rudder only"], correct: 1 },
                { q: "What increases significantly in a 45° bank turn?", options: ["Drag", "Lift", "Weight", "Thrust"], correct: 0 }
            ]
        }];

        // ============================================================
        // 2. STATE
        // ============================================================
        let currentModule = 0;
        let completedQuizzes = new Array(modules.length).fill(false);
        let simState = {
            pitch: 0.0,
            power: 0.5,
            airspeed: 80,
            altitude: 1000,
            verticalSpeed: 0
        };

        // ============================================================
        // 3. RENDER FUNCTIONS
        // ============================================================

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            modules.forEach((mod, idx) => {
                const btn = document.createElement('button');
                btn.className = `module-btn ${idx === currentModule ? 'active' : ''}`;
                btn.innerHTML = `
                    <span>${idx+1}. ${mod.title}</span>
                    <span class="badge ${completedQuizzes[idx] ? 'done' : ''}">${completedQuizzes[idx] ? '✓ Done' : idx+1}/${modules.length}</span>
                `;
                btn.addEventListener('click', () => {
                    currentModule = idx;
                    renderAll();
                    // Close mobile menu if open
                    document.querySelector('.sidebar').classList.remove('open');
                    document.getElementById('menuOverlay').classList.remove('active');
                });
                sidebar.appendChild(btn);
            });
        }

        function renderLesson() {
            const mod = modules[currentModule];
            document.getElementById('lessonTitle').textContent = `${mod.id+1}. ${mod.title}`;
            document.getElementById('lessonSub').textContent = mod.sub;
            document.getElementById('lessonText').innerHTML = mod.text;

            const pointsContainer = document.getElementById('keyPoints');
            pointsContainer.innerHTML = mod.points.map(p => `<span>✈️ ${p}</span>`).join('');

            // Quiz
            const quizContainer = document.getElementById('quizQuestions');
            quizContainer.innerHTML = '';
            mod.quiz.forEach((qItem, qIdx) => {
                const div = document.createElement('div');
                div.className = 'quiz-question';
                div.innerHTML = `<p>${qIdx+1}. ${qItem.q}</p>`;
                qItem.options.forEach((opt, oIdx) => {
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="radio" name="q${qIdx}" value="${oIdx}"> ${opt}`;
                    div.appendChild(label);
                });
                quizContainer.appendChild(div);
            });

            // Reset feedback
            const feedback = document.getElementById('quizFeedback');
            feedback.className = 'quiz-feedback';
            feedback.textContent = '';
            feedback.style.display = 'none';
        }

        function handleQuizSubmit() {
            const mod = modules[currentModule];
            let correctCount = 0;
            const total = mod.quiz.length;
            let allAnswered = true;

            mod.quiz.forEach((qItem, qIdx) => {
                const radios = document.querySelectorAll(`input[name="q${qIdx}"]`);
                let selected = null;
                radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
                if (selected === null) allAnswered = false;
                else if (selected === qItem.correct) correctCount++;
            });

            const feedback = document.getElementById('quizFeedback');
            feedback.style.display = 'block';

            if (!allAnswered) {
                feedback.className = 'quiz-feedback show fail';
                feedback.textContent = '⚠️ Please answer all questions before submitting.';
                return;
            }

            const passed = correctCount === total;
            if (passed) {
                completedQuizzes[currentModule] = true;
                feedback.className = 'quiz-feedback show pass';
                feedback.textContent = `✅ Excellent! You got ${correctCount}/${total} correct. Module complete!`;
                updateProgress();
                renderSidebar();
            } else {
                feedback.className = 'quiz-feedback show fail';
                feedback.textContent = `❌ You got ${correctCount}/${total} correct. Review the material and try again.`;
            }
        }

        function updateProgress() {
            const done = completedQuizzes.filter(Boolean).length;
            const pct = Math.round((done / modules.length) * 100);
            document.getElementById('progressPercentage').textContent = pct;
        }

        function renderAll() {
            renderLesson();
            renderSidebar();
            updateProgress();
        }

        // ============================================================
        // 4. FLIGHT SIMULATOR CANVAS + PHYSICS
        // ============================================================

        const canvas = document.getElementById('flightCanvas');
        const ctx = canvas.getContext('2d');
        const pitchSlider = document.getElementById('pitchSlider');
        const powerSlider = document.getElementById('powerSlider');
        const pitchValue = document.getElementById('pitchValue');
        const powerValue = document.getElementById('powerValue');
        const iasDisplay = document.getElementById('iasDisplay');
        const altDisplay = document.getElementById('altDisplay');
        const vsDisplay = document.getElementById('vsDisplay');

        function updateSimControls() {
            const pitch = parseFloat(pitchSlider.value);
            const power = parseFloat(powerSlider.value);
            simState.pitch = pitch;
            simState.power = power;
            pitchValue.textContent = pitch.toFixed(2);
            powerValue.textContent = power.toFixed(2);

            // Simple physics: pitch up + low power = slow down; pitch down + high power = speed up
            let targetAirspeed = 60 + (simState.power * 100) - (simState.pitch * 30);
            targetAirspeed = Math.max(30, Math.min(180, targetAirspeed));
            simState.airspeed += (targetAirspeed - simState.airspeed) * 0.05;

            // Altitude change: pitch up = climb (if enough speed), pitch down = descent
            let climbFactor = simState.pitch * 8;
            if (simState.airspeed < 55) climbFactor -= 5; // stall/spin penalty
            simState.verticalSpeed += (climbFactor - simState.verticalSpeed) * 0.1;
            simState.altitude += simState.verticalSpeed * 0.5;
            simState.altitude = Math.max(100, Math.min(4000, simState.altitude));

            // Display
            iasDisplay.textContent = Math.round(simState.airspeed);
            altDisplay.textContent = Math.round(simState.altitude);
            vsDisplay.textContent = Math.round(simState.verticalSpeed * 3); // scale to feet/min approx
        }

        function drawInstruments() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // ---- Attitude Indicator (Left side) ----
            const aiX = 100,
                aiY = 120,
                aiR = 90;

            ctx.save();
            ctx.beginPath();
            ctx.arc(aiX, aiY, aiR, 0, Math.PI * 2);
            ctx.clip();

            const pitchAngle = simState.pitch * 35;
            const centerY = aiY + pitchAngle * 1.2;

            ctx.fillStyle = '#1a3a5a';
            ctx.fillRect(aiX - aiR, aiY - aiR, aiR * 2, aiR);
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(aiX - aiR, aiY, aiR * 2, aiR);

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(aiX - aiR + 10, centerY);
            ctx.lineTo(aiX + aiR - 10, centerY);
            ctx.stroke();

            for (let i = -80; i <= 80; i += 20) {
                if (i === 0) continue;
                ctx.beginPath();
                ctx.moveTo(aiX + i, centerY - 5);
                ctx.lineTo(aiX + i, centerY + 5);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
            for (let deg = -30; deg <= 30; deg += 10) {
                if (deg === 0) continue;
                const yOff = deg * 1.2;
                ctx.beginPath();
                ctx.moveTo(aiX - 20, centerY + yOff);
                ctx.lineTo(aiX - 8, centerY + yOff);
                ctx.strokeStyle = deg > 0 ? '#ffaa44' : '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = '9px monospace';
                ctx.fillText(Math.abs(deg) + '°', aiX - 40, centerY + yOff + 3);
            }

            ctx.fillStyle = '#f2b84b';
            ctx.beginPath();
            ctx.moveTo(aiX + 28, aiY);
            ctx.lineTo(aiX + 40, aiY - 5);
            ctx.lineTo(aiX + 40, aiY + 5);
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(aiX, aiY, aiR, 0, Math.PI * 2);
            ctx.strokeStyle = '#5a8aaa';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#8dd0e6';
            ctx.font = '10px monospace';
            ctx.fillText('ATT', aiX - 16, aiY - aiR + 18);

            // ---- Airspeed Indicator (Right side) ----
            const asiX = 300,
                asiY = 120,
                asiR = 90;
            const speed = simState.airspeed;

            ctx.save();
            ctx.beginPath();
            ctx.arc(asiX, asiY, asiR, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = '#0d1a26';
            ctx.fillRect(asiX - asiR, asiY - asiR, asiR * 2, asiR * 2);

            const startAngle = -2.6;
            const endAngle = 2.6;
            const range = endAngle - startAngle;
            const arcRadius = asiR - 18;

            const greenStart = startAngle + (60 / 200) * range;
            const greenEnd = startAngle + (150 / 200) * range;
            ctx.beginPath();
            ctx.arc(asiX, asiY, arcRadius, greenStart, greenEnd);
            ctx.strokeStyle = '#44dd88';
            ctx.lineWidth = 14;
            ctx.stroke();

            const yellowStart = startAngle + (150 / 200) * range;
            const yellowEnd = startAngle + (180 / 200) * range;
            ctx.beginPath();
            ctx.arc(asiX, asiY, arcRadius, yellowStart, yellowEnd);
            ctx.strokeStyle = '#ddcc44';
            ctx.lineWidth = 14;
            ctx.stroke();

            const redStart = startAngle + (180 / 200) * range;
            const redEnd = startAngle + (200 / 200) * range;
            ctx.beginPath();
            ctx.arc(asiX, asiY, arcRadius, redStart, redEnd);
            ctx.strokeStyle = '#dd4444';
            ctx.lineWidth = 14;
            ctx.stroke();

            const needleAngle = startAngle + (speed / 200) * range;
            ctx.beginPath();
            ctx.moveTo(asiX, asiY);
            ctx.lineTo(asiX + Math.sin(needleAngle) * (asiR - 10), asiY - Math.cos(needleAngle) * (asiR - 10));
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(asiX, asiY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#f2b84b';
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(asiX, asiY, asiR, 0, Math.PI * 2);
            ctx.strokeStyle = '#5a8aaa';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#8dd0e6';
            ctx.font = '10px monospace';
            ctx.fillText('IAS', asiX - 14, asiY - asiR + 18);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px monospace';
            ctx.fillText(Math.round(speed) + ' kt', asiX - 38, asiY + 8);

            ctx.fillStyle = '#4a7a8a';
            ctx.font = '9px monospace';
            ctx.fillText('Pitch: ' + (simState.pitch > 0 ? 'UP' : 'DN'), 10, 20);
            ctx.fillText('Power: ' + Math.round(simState.power * 100) + '%', 10, 35);
        }

        function simLoop() {
            updateSimControls();
            drawInstruments();
            requestAnimationFrame(simLoop);
        }

        // ============================================================
        // 5. INIT & MOBILE TOGGLE
        // ============================================================

        document.getElementById('submitQuiz').addEventListener('click', handleQuizSubmit);

        pitchSlider.addEventListener('input', () => { /* loop handles updates */ });
        powerSlider.addEventListener('input', () => { /* loop handles updates */ });

        // Mobile hamburger & overlay
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('menuOverlay');

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });

        // Close menu on window resize back to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 640) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        });

        // Initial render
        renderAll();
        simLoop();

        console.log('✈️ Aviation Course Simulator loaded. Fully responsive for phone & PC.');
    </script>

</body>
</html>
